name: Repeat Lardi-Trans lorries

on:
  push:
    branches: [ "main" ]
  # Run it by hand from the Actions tab ("Run workflow").
  workflow_dispatch:
  schedule:
    # Every 30 minutes, 08:00-22:30 UTC (= 10:00-00:30 Kyiv in winter, 11:00-01:30 in summer).
    # Cron can't do "every 50 minutes"; minutes 5,35 avoid the busy top of the hour,
    # when GitHub delays scheduled runs the most.
    # Note: GitHub disables scheduled workflows after 60 days without commits.
    - cron: "5,35 8-22 * * *"

concurrency:
  group: repeat-lorries
  cancel-in-progress: false

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Repeat published lorries
      env:
        token: ${{ secrets.TOKEN }}
      run: mvn -B test
