name: Repeat Lardi-Trans lorries

on:
  push:
    branches: [ "main" ]
  # Run it by hand from the Actions tab ("Run workflow").
  workflow_dispatch:
  schedule:
    # Every 5 minutes, 08:00-22:55 UTC (= 10:00-00:55 Kyiv in winter, 11:00-01:55 in summer).
    # 5 minutes is GitHub's minimum; GitHub often delays or skips scheduled runs when busy.
    # Note: GitHub disables scheduled workflows after 60 days without commits.
    - cron: "*/5 8-22 * * *"

concurrency:
  group: repeat-lorries
  cancel-in-progress: false

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Repeat published lorries
      env:
        token: ${{ secrets.TOKEN }}
      run: mvn -B test
